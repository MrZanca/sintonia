[package]
name = "sintonia-app"
description = "Sintonia: la finestra (Slint)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "sintonia"
path = "src/main.rs"

[dependencies]
sintonia-core = { path = "../sintonia-core" }
sintonia-player = { path = "../sintonia-player" }
slint = { workspace = true }
glow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
thiserror = { workspace = true }
rfd = "0.17.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
sys-locale = "0.3.2"
directories = "6.0.0"

[build-dependencies]
slint-build = { workspace = true }

[lints]
workspace = true
