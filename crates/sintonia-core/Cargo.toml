[package]
name = "sintonia-core"
description = "Sintonia: logica senza interfaccia (sorgenti, guida, database)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
chacha20poly1305 = "0.11.0"
directories = "6.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
keyring = "4.2.0"
log.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "stream", "http2", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = { workspace = true }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "fs", "macros", "io-util", "net"] }

[features]
# finto server Xtream per test e sviluppo (vedi src/xtream_mock.rs)
mock = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[[example]]
name = "finto_xtream"
required-features = ["mock"]
