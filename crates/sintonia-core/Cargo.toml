[package]
name = "sintonia-core"
description = "Sintonia: logica senza interfaccia (sorgenti, guida, database)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
chacha20poly1305 = "0.11.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
log.workspace = true
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "stream", "http2", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = { workspace = true }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "fs", "macros", "io-util", "net"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "4.2.0"

# Android: niente portachiavi di sistema raggiungibile da Rust; si passa da Java (Keystore,
# cartelle dell'app, proxy), vedi src/android.rs
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[features]
# finto server Xtream per test e sviluppo (vedi src/xtream_mock.rs)
mock = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[[example]]
name = "finto_xtream"
required-features = ["mock"]

[[example]]
name = "stress"
required-features = ["mock"]
